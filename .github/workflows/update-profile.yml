name: Update Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install --upgrade pip Pillow

      - name: Generate animated terminal ASCII profile
        env:
          GITHUB_USERNAME: pranavtdhote
        run: python scripts/generate_ascii_profile.py

      - name: Generate GitHub analytics
        env:
          GITHUB_USERNAME: pranavtdhote
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_github_assets.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: refresh profile visuals"
            git push
          fi
