name: Update Profile Visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow

      - name: Generate ASCII profile
        env:
          GITHUB_USERNAME: pranavtdhote
        run: python scripts/generate_ascii.py

      - name: Generate GitHub stats and language map
        env:
          GITHUB_USERNAME: pranavtdhote
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Generate contribution matrix
        env:
          GITHUB_USERNAME: pranavtdhote
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_contributions.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update profile visuals"
            git push
          fi
